<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ensemble">
  <!-- Maskable / apple-touch variant: identical glyph on a full-bleed ink
       ground (no rounded corners) so the launcher can apply its own mask.
       The glyph sits inside the 40%-radius safe zone. Also serves as the
       opaque apple-touch-icon. -->
  <defs>
    <linearGradient id="inkm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1610"/>
      <stop offset="1" stop-color="#120f0a"/>
    </linearGradient>
    <radialGradient id="lampm" cx="0.5" cy="0.08" r="0.78">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0.20"/>
      <stop offset="0.62" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#inkm)"/>
  <rect width="512" height="512" fill="url(#lampm)"/>
  <!-- brass stage -->
  <rect x="108" y="372" width="296" height="12" rx="6" fill="#d9a441" fill-opacity="0.9"/>
  <!-- voices -->
  <rect x="114" y="218" width="44" height="160" rx="22" fill="#9ab33a"/>
  <rect x="174" y="164" width="44" height="214" rx="22" fill="#8b86d6"/>
  <rect x="234" y="132" width="44" height="246" rx="22" fill="#4a9fd4"/>
  <rect x="294" y="168" width="44" height="210" rx="22" fill="#e0568f"/>
  <rect x="354" y="222" width="44" height="156" rx="22" fill="#b8a98a"/>
</svg>
