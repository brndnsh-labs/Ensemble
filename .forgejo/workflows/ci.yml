name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The full non-browser gate. `npm run ci` is the single source of truth for
  # what "green" means — typecheck, depcheck, knip, mutation/lint/docs checks,
  # unit tests, production build, and bundle-size budgets — so `npm run ci`
  # locally predicts this job exactly. Keep this job's checks == that script;
  # don't add gate steps here that aren't in the script (or vice versa).
  checks:
    runs-on: [self-hosted, ensemble]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the full gate (npm run ci)
        run: npm run ci

  e2e-tests:
    runs-on: [self-hosted, ensemble]
    timeout-minutes: 25
    # Gate first (fast, cheap) before spending a runner slot on the browser suite.
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Browser binaries only — no `--with-deps`. The host system libraries are
      # pre-installed on the self-hosted runner (one-time `sudo playwright
      # install-deps`), so CI never needs sudo. Binaries land in ~/.cache as the
      # runner user; on a self-hosted box that cache persists across runs.
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install

      - name: Run Playwright tests
        run: npm run test:e2e

      # Pinned to @v3 on Forgejo: upload-artifact@v4+ uses the @actions/artifact
      # v2 protocol, which this Forgejo build (gitea-1.22) rejects with
      # GHESNotSupportedError. @v3 uses the older artifact API Forgejo supports.
      # (The GitHub workflow keeps @v7.)
      - uses: actions/upload-artifact@v3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Continuous deployment: main IS live. A push to main only happens via a
  # green PR merge (main is branch-protected, no direct push), so reaching this
  # job means the full gate already passed on this exact commit — deploy it.
  # `workflow_dispatch` on main is a manual break-glass redeploy (no new commit).
  # Serialization is by the single self-hosted runner: two deploys can't run at
  # once. (If a second runner is ever added, add a `concurrency:` group here.)
  #
  # RUNNER DEPENDENCY: jobs run directly on the self-hosted host (not a
  # container — that's why the Playwright host-libs note above applies), so
  # `deploy.sh prod`'s `rsync -e ssh` needs BOTH `rsync` and an ssh client
  # installed on the runner box. A missing `rsync` fails ONLY this job (checks
  # + e2e are green, since they don't shell out to it) with prod left unchanged.
  # One-time provisioning on ghrunner01: `sudo apt-get install -y rsync openssh-client`.
  deploy:
    runs-on: [self-hosted, ensemble]
    needs: [checks, e2e-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Materialize the `ensemble-admin` ssh alias that deploy.sh targets, from
      # the dedicated CI deploy key (a scoped keypair — not the laptop's key).
      # Secrets go through env, never interpolated into the command line.
      - name: Configure deploy SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          {
            echo "Host ensemble-admin"
            echo "  HostName $PROD_DEPLOY_HOST"
            echo "  User $DEPLOY_SSH_USER"
            echo "  IdentityFile ~/.ssh/ci_deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config

      # deploy.sh builds --mode production, rsyncs to prod, and self-verifies the
      # live REV == built REV (its exit-1-on-mismatch is our post-deploy check).
      - name: Deploy to prod
        run: ./scripts/deploy.sh prod
