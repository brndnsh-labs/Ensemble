name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The full non-browser gate. `npm run ci` is the single source of truth for
  # what "green" means — typecheck, depcheck, knip, mutation/lint/docs checks,
  # unit tests, production build, and bundle-size budgets — so `npm run ci`
  # locally predicts this job exactly. Keep this job's checks == that script;
  # don't add gate steps here that aren't in the script (or vice versa).
  checks:
    runs-on: [self-hosted, ensemble]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the full gate (npm run ci)
        run: npm run ci

  e2e-tests:
    runs-on: [self-hosted, ensemble]
    timeout-minutes: 25
    # Gate first (fast, cheap) before spending a runner slot on the browser suite.
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Browser binaries only — no `--with-deps`. The host system libraries are
      # pre-installed on the self-hosted runner (one-time `sudo playwright
      # install-deps`), so CI never needs sudo. Binaries land in ~/.cache as the
      # runner user; on a self-hosted box that cache persists across runs.
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install

      - name: Run Playwright tests
        run: npm run test:e2e

      # Pinned to @v3 on Forgejo: upload-artifact@v4+ uses the @actions/artifact
      # v2 protocol, which this Forgejo build (gitea-1.22) rejects with
      # GHESNotSupportedError. @v3 uses the older artifact API Forgejo supports.
      # (The GitHub workflow keeps @v7.)
      - uses: actions/upload-artifact@v3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
