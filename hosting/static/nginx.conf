# Same configuration in test and production. Mount the parent directory, not the
# current symlink: Docker otherwise pins the old symlink target at container start.
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /site/current;
        index index.html;
        disable_symlinks off;
        # No SPA fallback: missing bundles/API routes must never return app HTML.
        location / { try_files $uri $uri/ =404; }
        location ~ (^|/)\. { return 404; }
        location = /current { return 404; }
        location /current/ { return 404; }
        location = /api { return 404; }
        location /api/ { return 404; }
        location = /sw.js { add_header Cache-Control "no-store" always; }
        location = / { add_header Cache-Control "no-cache" always; }
        location = /index.html { add_header Cache-Control "no-cache" always; }
        location = /manifest.json { add_header Cache-Control "no-cache" always; }
        # Only test is provisioned with a v2 symlink. Production returns 404 here.
        location /v2/ {
            root /site;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ =404;
        }
    }
}
