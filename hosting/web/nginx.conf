# The edge config for the `ensemble-web` image (#1356): the music stand built at
# `/`, served from inside the image instead of a bind-mounted release
# directory. The cache, header and fallback rules are written out below; an image has no
# release symlink to swap, so there is no `current` link or `disable_symlinks`. The old beta
# path `/v2/...` is a plain 404 like any other missing path (#1742).
#
# `hosting/README.md` § "What the edge config must do" is the contract. Every
# non-obvious rule here says which requirement it is answering, because getting one wrong
# strands a returning browser on a shell that no longer exists.

# Non-root, read-only rootfs: nothing may be written outside the tmpfs at /tmp. The base
# image is nginxinc/nginx-unprivileged, which already listens on 8080 as uid 101.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    # `.webmanifest` is not in nginx's stock table. We ship `manifest.json` today (a frozen
    # path: installed copies already point at it), but a second `types` block APPENDS to the included
    # one, so mapping it costs nothing and stops a future rename from serving a manifest as
    # application/octet-stream, which browsers refuse.
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;
    # Every scratch path inside the tmpfs, so `read_only: true` holds.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Text only. The sound packs under /packs/ are AAC in an MP4 container and already
    # compressed: gzipping them burns CPU to add bytes. `text/html` is compressed
    # unconditionally by nginx and must not be listed (it warns about the duplicate).
    # No brotli: the base image is built without the module and this config does not add
    # one — Cloudflare re-compresses at the edge anyway.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ONE cache policy per path, resolved here rather than with per-location `add_header`.
    # nginx's `add_header` does not merge across levels: a single `add_header` inside a
    # location silently drops every header the server block set, so a per-location
    # Cache-Control would have quietly cost the security headers below. A map keeps all of
    # them on one inherited `add_header` list.
    #
    # Exact strings are matched before regexes regardless of the order they appear in.
    map $uri $ensemble_cache {
        # Mutable entry points revalidate on every use: the HTML, the RSC payload text
        # files beside it, /manifest.json and /pack-files.json.
        default "no-cache";
        # Content-hashed by the Next export; the filename changes when the bytes do.
        ~^/_next/static/ "public, max-age=31536000, immutable";
        # Downloaded through `lib/sounds.ts`, which fetches with `cache: 'no-store'` and
        # verifies each file against the sha256 in /pack-files.json before it keeps it. The
        # HTTP cache is therefore not load-bearing here; an hour only spares a repeat
        # visitor who bypasses that path.
        ~^/packs/ "public, max-age=3600";
        # The PWA icons the manifest names. Long enough to matter on a home-screen launch,
        # short enough that replacing one is a same-day change.
        ~^/icon "public, max-age=86400";
        # The service worker stays no-store. The registration also asks for
        # `updateViaCache: 'none'`, but the origin must not be the thing that pins a browser
        # to the old script.
        /sw.js "no-store";
        # How one release is told from another. The worker precaches `${scope}build.json` in
        # `scripts/offline.mjs`'s ASSETS list, and the CI `deploy` job verifies a release by
        # fetching it; a copy served out of the HTTP cache would report the previous release
        # to both.
        /build.json "no-store";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # This container sits behind Caddy and Cloudflare and speaks plain HTTP on a LAN
        # port. An absolute Location would therefore bake `http://<container-ip>:8080/` into
        # a redirect a public browser follows — a production bug, not a cosmetic one. Keep
        # every redirect relative; the client resolves it against the origin it asked.
        absolute_redirect off;
        port_in_redirect off;

        # IPv4-only on purpose: the deployment publishes a host port through Docker's
        # userland proxy, and `listen [::]:8080` fails to bind where the container netns has
        # no IPv6 — the base image's entrypoint script that patches this in is bypassed here.

        # What docs/SECURITY.md F5 says has to come from the web-server layer: `nosniff` and
        # `frame-ancestors` cannot be delivered by the `<meta>` CSP the app carries. HSTS is
        # deliberately NOT here — this origin is plain HTTP behind the edge, where the header
        # would be ignored, and it is Caddy/Cloudflare's to set. No script/connect policy
        # either (#1395): `web/scripts/offline.mjs` bakes a `<meta>` CSP with that
        # policy into every exported HTML file at build time, because the Playwright preview
        # server this app's suite runs against (`scripts/serve.mjs`) sends no headers of its
        # own — an nginx-only policy would never be exercised by the one suite that checks it.
        # A second, blunter script/connect policy from THIS layer would only be a way to break
        # the export on a Next upgrade with no test ever catching it first.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control $ensemble_cache always;

        # Caddy splits `/api/*` to the account API before a request can reach this container.
        # If one arrives here anyway the route is misconfigured, and the honest answer is a
        # 404: never app HTML (a JSON caller would parse a shell as a reply) and never a
        # proxy this container has no business performing.
        location = /api { return 404; }
        location /api/ { return 404; }

        # No dotfile is ever part of the published artifact; a request for one is either a
        # scanner or a packaging mistake.
        location ~ (^|/)\. { return 404; }

        # No SPA fallback, and no `error_page 404` either. The service worker serves the
        # cached shell for a navigation the NETWORK refuses, which is an offline affordance,
        # not a rewrite rule: online, a missing path must still be a real 404. A branded
        # `/404.html` exists in the export and stays reachable, but wiring it to `error_page`
        # would make a real 404 and an accidental SPA fallback look identical from outside —
        # both "200-shaped HTML" — and this rule is the one the smoke test has to be able to
        # tell apart. `autoindex` stays off (nginx's default), so a directory without an
        # index file is a refusal rather than a listing of the artifact.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
