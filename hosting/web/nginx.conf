# The edge config for the `ensemble-web` image (#1356): the v2 music stand built at
# `ENSEMBLE_V2_BASE=/`, served from inside the image instead of a bind-mounted release
# directory. `hosting/static/nginx.conf` is the rsync/symlink runtime this replaces at the
# cutover; the rules that still apply are carried over below with the same wording, and the
# ones that were about that layout (the `current` symlink, `disable_symlinks`, the `/v2`
# second document root) are gone because an image has no symlink to swap.
#
# `hosting/README.md` § "What the cutover's edge config must do" is the contract. Every
# non-obvious rule here says which requirement it is answering, because getting one wrong
# strands a returning browser on a shell that no longer exists.

# Non-root, read-only rootfs: nothing may be written outside the tmpfs at /tmp. The base
# image is nginxinc/nginx-unprivileged, which already listens on 8080 as uid 101.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    # `.webmanifest` is not in nginx's stock table. We ship `manifest.json` today (v1's exact
    # path — see the manifest note below), but a second `types` block APPENDS to the included
    # one, so mapping it costs nothing and stops a future rename from serving a manifest as
    # application/octet-stream, which browsers refuse.
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;
    # Every scratch path inside the tmpfs, so `read_only: true` holds.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Text only. The sound packs under /packs/ are AAC in an MP4 container and already
    # compressed: gzipping them burns CPU to add bytes. `text/html` is compressed
    # unconditionally by nginx and must not be listed (it warns about the duplicate).
    # No brotli: the base image is built without the module and this config does not add
    # one — Cloudflare re-compresses at the edge anyway.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ONE cache policy per path, resolved here rather than with per-location `add_header`.
    # nginx's `add_header` does not merge across levels: a single `add_header` inside a
    # location silently drops every header the server block set, so a per-location
    # Cache-Control would have quietly cost the security headers below. A map keeps all of
    # them on one inherited `add_header` list.
    #
    # Exact strings are matched before regexes regardless of the order they appear in.
    map $uri $ensemble_cache {
        # Mutable entry points revalidate on every use: the HTML, the RSC payload text
        # files beside it, /manifest.json and /pack-files.json.
        default "no-cache";
        # Content-hashed by the Next export; the filename changes when the bytes do.
        ~^/_next/static/ "public, max-age=31536000, immutable";
        # Downloaded through `lib/sounds.ts`, which fetches with `cache: 'no-store'` and
        # verifies each file against the sha256 in /pack-files.json before it keeps it. The
        # HTTP cache is therefore not load-bearing here; an hour only spares a repeat
        # visitor who bypasses that path.
        ~^/packs/ "public, max-age=3600";
        # The PWA icons the manifest names. Long enough to matter on a home-screen launch,
        # short enough that replacing one is a same-day change.
        ~^/icon "public, max-age=86400";
        # Service workers stay no-store, as the v1 config already kept v1's worker. The
        # registration also asks for `updateViaCache: 'none'`, but the origin must not be
        # the thing that pins a browser to the old script — for /v2/sw.js in particular,
        # the update check is the ONLY request a browser holding the beta worker still makes.
        /sw.js "no-store";
        /v2/sw.js "no-store";
        # How one release is told from another. The worker precaches `${scope}build.json` in
        # `scripts/offline.mjs`'s ASSETS list, and `scripts/deploy.mjs` verifies a published
        # release by fetching it; a copy served out of the HTTP cache would report the
        # previous deploy to both.
        /build.json "no-store";
    }

    # Where a `/v2/...` request moves to. Computed from `$request_uri` — the RAW request
    # target, path and query exactly as the browser sent them — and not from the normalised,
    # percent-DECODED `$uri`, so the redirect hands back the same bytes it was given instead
    # of re-encoding or double-decoding a path. The default is the site root, which is what a
    # bare `/v2` deserves.
    #
    # The first rule is an OPEN-REDIRECT guard and has to stay first: map regexes are tried in
    # the order they are written. Slicing a prefix off a path is not safe on its own —
    # `/v2//evil.example/x` slices to `//evil.example/x`, a protocol-relative URL, and
    # `/v2/\/evil.example/x` slices to `/\/evil.example/x`, which a WHATWG URL parser reads the
    # same way because `\` is a path separator in a special scheme. Both send a browser
    # off-origin from a redirect it was told to trust. This is the exact shape #1355's
    # tombstone declines to forward and hands here ("#1356's redirect can have it"), so here is
    # where it has to be answered: a second separator right after the prefix means the rest of
    # the target is an authority, not a path, and the only safe destination is the site root.
    # `\\\\` is two levels of unescaping — nginx turns `\\` into `\` inside a quoted string,
    # leaving PCRE the character class `[/\\]`.
    map $request_uri $ensemble_v2_moved {
        default "/";
        "~^/v2/[/\\\\]" "/";
        "~^/v2\?(?<v2_query>.*)$" "/?$v2_query";
        "~^/v2/(?<v2_rest>.*)$" "/$v2_rest";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # This container sits behind Caddy and Cloudflare and speaks plain HTTP on a LAN
        # port. An absolute Location would therefore bake `http://<container-ip>:8080/` into
        # a redirect a public browser follows — a production bug, not a cosmetic one. Keep
        # every redirect relative; the client resolves it against the origin it asked.
        absolute_redirect off;
        port_in_redirect off;

        # IPv4-only on purpose: the deployment publishes a host port through Docker's
        # userland proxy, and `listen [::]:8080` fails to bind where the container netns has
        # no IPv6 — the base image's entrypoint script that patches this in is bypassed here.

        # What docs/SECURITY.md F5 says has to come from the web-server layer: `nosniff` and
        # `frame-ancestors` cannot be delivered by the `<meta>` CSP the app carries. HSTS is
        # deliberately NOT here — this origin is plain HTTP behind the edge, where the header
        # would be ignored, and it is Caddy/Cloudflare's to set. No script/connect policy
        # either: the app's own `<meta>` CSP owns that, and a second, blunter one from the
        # edge would only be a way to break the export on a Next upgrade.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control $ensemble_cache always;

        # THE carve-out. The root build emits `out/v2/sw.js`: a tombstone that retires the
        # beta's `/v2/`-scoped worker, forwards its windows to the same path without the
        # prefix and unregisters itself. It must be served as a FILE and must never redirect.
        # A browser holding that worker answers the whole of `/v2/` from its own cache, so a
        # bookmarked `/v2/` never reaches this server at all; its one remaining request is the
        # update check for this exact path, and the spec fetches a worker script with
        # redirects DISABLED. A 308 here leaves that browser on a dead release forever. An
        # exact-match location outranks both the prefix redirect below and every regex, so
        # this wins however the rest of the file is reordered.
        location = /v2/sw.js {
            try_files $uri =404;
        }

        # Everything else the beta published moves to the same path at the root, carrying the
        # rest of the path AND the query: `/v2/x?y` -> `/x?y`, which is what the tombstone
        # does for the windows it can reach, so a browser gets the same destination either
        # way. (A fragment never reaches a server; the tombstone preserves that half.)
        # 308 rather than 301/302 so the method and body survive, and so no intermediary
        # rewrites a POST into a GET. Location prefixes are case-sensitive, so `/V2/` is a
        # plain 404 from the rule at the bottom rather than a redirect — deliberate: the beta
        # only ever published the lowercase path, and a case-insensitive match here would be a
        # second, looser way into the redirect for no one who was ever sent there.
        location = /v2 { return 308 $ensemble_v2_moved; }
        location /v2/ { return 308 $ensemble_v2_moved; }

        # Caddy splits `/api/*` to the account API before a request can reach this container.
        # If one arrives here anyway the route is misconfigured, and the honest answer is a
        # 404: never app HTML (a JSON caller would parse a shell as a reply) and never a
        # proxy this container has no business performing.
        location = /api { return 404; }
        location /api/ { return 404; }

        # No dotfile is ever part of the published artifact; a request for one is either a
        # scanner or a packaging mistake. Regex locations outrank the `/v2/` prefix above, so
        # `/v2/.git/config` is a 404 here too rather than a redirect that advertises the path.
        location ~ (^|/)\. { return 404; }

        # No SPA fallback, and no `error_page 404` either. The service worker serves the
        # cached shell for a navigation the NETWORK refuses, which is an offline affordance,
        # not a rewrite rule: online, a missing path must still be a real 404. A branded
        # `/404.html` exists in the export and stays reachable, but wiring it to `error_page`
        # would make a real 404 and an accidental SPA fallback look identical from outside —
        # both "200-shaped HTML" — and this rule is the one the smoke test has to be able to
        # tell apart. `autoindex` stays off (nginx's default), so a directory without an
        # index file is a refusal rather than a listing of the artifact.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
