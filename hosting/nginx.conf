# The whole server: static files on port 8080, as uid 101, writing nothing
# outside /tmp, so the container can run with a read-only root filesystem.
# TLS, HSTS and compression for the outside world belong to whatever is in
# front of it.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    # Not in nginx's own table; a browser will not install from a manifest served as a download.
    types { application/manifest+json webmanifest; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Text only: the instrument recordings are Opus and already as small as they get.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    # One cache rule per path. The service worker is what keeps the app on a
    # device; the HTTP cache must never be what pins a browser to an old build.
    map $uri $cache {
        # The page, the manifest, the icons, the packs: asked about every time (a 304 when unchanged).
        default "no-cache";
        # The worker itself is never kept: it is how a new build arrives.
        /sw.js "no-store";
        # Named for their contents by the build; a new build is a new name.
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # The app has one page and keeps its place after the `#`, so there is
        # nothing to rewrite: a path that is not a file is a real 404.
        location / { try_files $uri $uri/index.html =404; }
        location ~ /\. { return 404; }
    }
}
