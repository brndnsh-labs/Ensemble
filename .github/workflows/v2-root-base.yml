# Proof that the v2 music stand still builds and passes its own suite at basePath `/`
# (#1354), and that the `ensemble-web` image which serves that build honours the cutover's
# edge contract (#1356) — see docs/design/ensemble-v2-rollout.md decision 1,
# `prototypes/v2/scripts/base-path.mjs` and hosting/README.md.
#
# DELIBERATELY NOT A REQUIRED CONTEXT, and deliberately a separate workflow rather than a leg
# of ci.yml's `v2-suite`: the required `v2-checks` aggregate is `needs: v2-suite`, so any new
# matrix leg there would gate merges on a build nothing ships yet. Nothing here uploads
# `ensemble-v2-static-<sha>` or touches the `deploy` job's artifact — `/v2` remains the only
# thing CI publishes until the cutover replaces that publisher with the web image.
#
# It runs on demand, and automatically on a PR that touches the base-path machinery itself —
# the only change that can plausibly break the root build without breaking the `/v2` one.
name: v2 root base

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/v2/scripts/base-path.mjs'
      - 'prototypes/v2/lib/base-path.ts'
      - 'prototypes/v2/next.config.mjs'
      - 'prototypes/v2/scripts/offline.mjs'
      - 'prototypes/v2/scripts/serve.mjs'
      - 'prototypes/v2/scripts/deploy.mjs'
      - 'prototypes/v2/lib/sounds.ts'
      - 'prototypes/v2/app/use-offline-install.ts'
      - 'prototypes/v2/app/layout.tsx'
      - 'prototypes/v2/checks/fixtures.ts'
      # The root-only handover, manifest and offline-navigation specs (#1355). They skip with a
      # reason on a `/v2` build, so this job is the only place they actually run.
      - 'prototypes/v2/checks/root-handover.chromium.spec.ts'
      # The image that serves that root build, and the edge config it carries (#1356).
      - 'hosting/web/**'
      - '.github/workflows/v2-root-base.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ENSEMBLE_V2_BASE: /

jobs:
  v2-root-base:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            prototypes/v2/package-lock.json
            prototypes/v2-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install v2 dependencies
        run: npm ci --prefix prototypes/v2

      # The account specs run the real API behind the preview server (#1258); the suite's
      # global setup bundles it from these dependencies.
      - name: Install v2 API dependencies
        run: npm ci --prefix prototypes/v2-api

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV
        working-directory: prototypes/v2

      # Same key as ci.yml's `v2-suite`, so this job reuses that cache rather than warming
      # a second copy of the browsers.
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
        working-directory: prototypes/v2

      - name: Install Playwright system deps (browsers came from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
        working-directory: prototypes/v2

      # A failed build leaves whatever `out/` held before it, and the suite would happily pass
      # against that — so the build's exit code is the gate, and the assertion below proves the
      # artifact on disk really is the root one before any test runs.
      - name: Build the v2 static export at basePath /
        run: npm run build --prefix prototypes/v2

      - name: Assert the artifact is the root build
        run: |
          # `set -e` ignores a command inverted with `!`, so each negative is an explicit `if`.
          set -euo pipefail
          test -f prototypes/v2/out/index.html
          grep -q '"/_next/static/' prototypes/v2/out/index.html
          if grep -q '/v2/_next/' prototypes/v2/out/index.html; then
            echo '::error::index.html still references /v2/_next'; exit 1
          fi
          if grep -q '"/v2/' prototypes/v2/out/build.json; then
            echo '::error::build.json is still keyed under /v2/'; exit 1
          fi
          grep -q 'const SCOPE = "/";' prototypes/v2/out/sw.js
          # The cutover's own artifacts (#1355): the web manifest v1's installed PWA updates
          # into, and the tombstone that retires the beta's `/v2/` worker. Both exist only here.
          test -f prototypes/v2/out/manifest.json
          test -f prototypes/v2/out/v2/sw.js

      - name: Run the v2 Playwright suite at basePath /
        run: npm run test:e2e --prefix prototypes/v2

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: v2-root-base-playwright-failures
          path: prototypes/v2/test-results/
          retention-days: 7

  # The same image ci.yml's `web-image` publishes on a merge, built and proven HERE with no
  # registry involved: `push: false, load: true`, then the identical smoke script against a
  # running container. That is the point of the split — the config is the deliverable, and a
  # rule as easy to get wrong as the `/v2/sw.js` carve-out has to be provable on the PR that
  # writes it, not only after it has been published under a tag.
  #
  # A separate job rather than more steps on `v2-root-base`: it needs no browsers, and it must
  # still report when the Playwright half is red. It builds its own export for the same reason
  # — a job that downloaded one could not run on its own.
  v2-root-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            prototypes/v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install v2 dependencies
        run: npm ci --prefix prototypes/v2

      - name: Build the v2 static export at basePath /
        run: npm run build --prefix prototypes/v2

      # `scripts/offline.mjs` stamps build.json with `git rev-parse HEAD`, and the smoke test
      # asserts the image reports exactly that. Read it from git rather than `github.sha` so
      # the two cannot disagree on an event that checks out something else.
      - name: Record the built revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assert the artifact is the root build
        run: |
          # `set -e` ignores a command inverted with `!`, so each negative is an explicit `if`.
          set -euo pipefail
          grep -q 'const SCOPE = "/";' prototypes/v2/out/sw.js
          test -f prototypes/v2/out/manifest.json
          test -f prototypes/v2/out/v2/sw.js
          if grep -q '/v2/_next/' prototypes/v2/out/index.html; then
            echo '::error::index.html still references /v2/_next'; exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      # Loaded into the local daemon, never pushed: this job has no registry credential and
      # must work on a fork PR, where secrets are withheld.
      - name: Build the web image locally
        uses: docker/build-push-action@v7
        with:
          context: hosting/web
          build-contexts: site=prototypes/v2/out
          push: false
          load: true
          provenance: false
          build-args: REVISION=${{ steps.revision.outputs.sha }}
          tags: ensemble-web:pr

      - name: Smoke-test the running container
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: node hosting/web/smoke.mjs ensemble-web:pr "$REVISION"
