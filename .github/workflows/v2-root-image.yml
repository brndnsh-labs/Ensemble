# PR-time proof that the `ensemble-web` image, serving the v2 export (built at `/`, the only base),
# honours its edge contract (#1356) — see docs/archive/ensemble-v2-rollout.md
# decision 1 and hosting/README.md. ci.yml's `web-image`
# builds the same image only after a merge; this proves it on the pull request that changes it.
#
# The root build's Playwright suite no longer runs here (#1400): ci.yml's required `v2-suite`
# builds and tests at `/` itself. This workflow used to repeat that
# whole suite, unsharded, beside it.
#
# NOT A REQUIRED CONTEXT. Nothing here uploads an export or publishes anything at all.
name: v2 root image

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      # The export compiles the shared engine and songbook code through webpack, so a `core/`
      # change can break the root build the image serves.
      - 'core/**'
      # The image that serves that root build, and the edge config it carries (#1356).
      - 'hosting/web/**'
      - '.github/workflows/v2-root-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The same image ci.yml's `web-image` publishes on a merge, built and proven HERE with no
  # registry involved: `push: false, load: true`, then the identical smoke script against a
  # running container. That is the point of the split — the config is the deliverable, and an
  # edge rule has to be provable on the PR that writes it, not only after it has been published
  # under a tag.
  v2-root-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install v2 dependencies
        run: npm ci --prefix web

      - name: Build the v2 static export at basePath /
        run: npm run build --prefix web

      # `scripts/offline.mjs` stamps build.json with `git rev-parse HEAD`, and the smoke test
      # asserts the image reports exactly that. Read it from git rather than `github.sha` so
      # the two cannot disagree on an event that checks out something else.
      - name: Record the built revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assert the artifact is the root build
        run: |
          # `set -e` ignores a command inverted with `!`, so each negative is an explicit `if`.
          set -euo pipefail
          grep -q 'const SCOPE = "/";' web/out/sw.js
          test -f web/out/manifest.json
          if [ -e web/out/v2 ]; then
            echo '::error::the export still has a /v2/ tree'; exit 1
          fi
          if grep -q '/v2/_next/' web/out/index.html; then
            echo '::error::index.html still references /v2/_next'; exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      # Loaded into the local daemon, never pushed: this job has no registry credential and
      # must work on a fork PR, where secrets are withheld.
      - name: Build the web image locally
        uses: docker/build-push-action@v7
        with:
          context: hosting/web
          build-contexts: site=web/out
          push: false
          load: true
          provenance: false
          build-args: REVISION=${{ steps.revision.outputs.sha }}
          tags: ensemble-web:pr

      - name: Smoke-test the running container
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: node hosting/web/smoke.mjs ensemble-web:pr "$REVISION"
