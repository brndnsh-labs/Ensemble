# CI + continuous deployment. Moved here from `.forgejo/workflows/` at the
# 2026-08-04 GitHub flip.
#
# RUNNER: `ubuntu-latest`, NOT the org's self-hosted runner on ghrunner01. That is
# deliberate and not negotiable while this repo is public — the org runner group
# refuses public repos, and for good reason: a fork PR carries its own workflow YAML,
# so a self-hosted LAN box would execute an outside contributor's code. Being
# open-source means inviting exactly that traffic. Do not "fix" a queued job by
# switching to `[self-hosted, ensemble]`; it will queue forever.
#
# BRANCH PROTECTION: because this repo is public, a Free org CAN protect its branches
# server-side (it cannot for a private repo — that's why every other repo in this fleet
# relies on a client-side merge guard). `main` requires the `checks` and `e2e-tests`
# contexts, so the `needs:` edge below is a second belt, not the only one.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      hosting_probe:
        description: Read-only docker04 deployment-account probe (does not deploy)
        type: boolean
        default: false

# Supersede in-flight PR runs when a branch is pushed again. Runs on main are NOT
# grouped here (#1223): only publishing needs serializing and the `deploy` job carries
# its own group, so two merges' gates run side by side. A workflow-level group on main
# used to serialize every gate behind the previous merge's AND — GitHub keeps at most
# one pending run per group — cancelled a queued main run outright, losing that
# commit's receipt and api-image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The full non-browser gate. `npm run ci` is the single source of truth for
  # what "green" means — typecheck (public/ + tests/), depcheck, knip,
  # mutation/lint/docs checks, unit tests, production build, and bundle-size
  # budgets — so `npm run ci` locally predicts this job exactly. Keep this
  # job's checks == that script; don't add gate steps here that aren't in the
  # script (or vice versa).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            prototypes/v2-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the full gate (npm run ci)
        run: npm run ci

      # The gate already built the production bundle. Seal and retain those exact
      # bytes. Since the cutover (#1357) nothing in this workflow consumes the artifact —
      # `ensemble-web` is what production serves — so it is kept only as evidence of what
      # this commit's v1 build was, until #1358 deletes v1 and this step with it.
      - name: Seal production static artifact
        run: node scripts/static-artifact.mjs seal dist production

      - uses: actions/upload-artifact@v7
        with:
          name: ensemble-static-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The v2 account API (#1187) is a standalone sibling package under
      # prototypes/v2-api/ with its own package-lock.json — same --prefix
      # pattern v2-preview.yml uses for prototypes/v2. Kept HERE, not in
      # e2e-tests: this suite is node-environment-only (node:sqlite, no DOM),
      # so it doesn't need that job's browser install.
      - name: Install v2 account API dependencies
        run: npm ci --prefix prototypes/v2-api

      - name: Run v2 account API tests
        run: npm run test:api

  # No `needs: checks`: this is a required context in its own right, and the edge
  # only put it (and v2-checks) behind checks' ~3 minutes on the critical path (#1223).
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # `--with-deps` IS needed here, unlike on the old self-hosted runner where the
      # host libraries were installed once by hand. A GitHub-hosted runner is a fresh
      # VM every run, and the suite includes a Mobile Safari project — that's real
      # webkit, whose system libraries are NOT preinstalled on ubuntu-latest.
      # The browser binaries cache; the apt-installed libraries cannot, so a cache hit
      # still has to re-run `install-deps`.
      - name: Install Playwright browsers + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (browsers came from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      # The offline-audio guards (reverb tail decays, harmony click-free) run in
      # Vitest browser mode against the same Chromium installed above — they need
      # a real `OfflineAudioContext`, which the node-mode `npm test` (happy-dom)
      # can't provide. Kept here (not in the `checks` job / `npm run ci`) because
      # only this job installs a browser. Fast (~2s); runs before the e2e suite
      # so an audio-graph regression fails early.
      - name: Run browser-mode audio guards
        run: npm run test:browser

      - name: Verify account storage in Chromium and WebKit
        run: npm run test:sync

      # `npm run test:e2e` builds the production bundle (VITE_E2E_BRIDGE=1) and
      # serves it via `vite preview` (see playwright.config.ts webServer) — the
      # suite exercises the real shipped artifact, not the dev server.
      - name: Run Playwright tests
        run: npm run test:e2e

      # @v3 was a Forgejo-only pin (that build's artifact API rejected @v4+ with
      # GHESNotSupportedError). On github.com @v3 is dead — retired 2025-01 — so this
      # is @v7 now.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # The v2 music stand (prototypes/v2, Next static export): build + its own Playwright
  # suite, and the required gate for this app. Runs on every PR, not only v2-touching
  # ones — the export compiles public/ through webpack, so any engine change can
  # break it. Starts alongside `checks`, not after it (#1223).
  #
  # It builds at the DEFAULT base (`/v2`). Since the cutover (#1357) that is no longer a
  # base anything is published at — production serves the `ENSEMBLE_V2_BASE=/` build inside
  # `ensemble-web` — so what this proves is the app and the shared `public/` code. The SHIPPED
  # base is proven before a merge by `.github/workflows/v2-root-base.yml`, whose path filter was
  # broadened to `prototypes/v2/**` + `public/**` + `hosting/web/**` for exactly that reason
  # (patch P2-2), and after a merge by `web-image` below. Pointing this suite at `/` instead,
  # and retiring that workflow, is the tidy end state and belongs with #1358.
  #
  # SHARDED across two runners. The suite is wait-bound, not CPU-bound: measured
  # 2026-09-16 on a 4-core box, 100 tests take 245s on three workers and still
  # 185s on six, because the playback tests spend their time waiting on real
  # laps. Adding workers to one runner barely helps and is what starves the tab
  # enough to drop a chord from the chart (#1240).
  #
  # Sharding only pays off WITH `fullyParallel` in playwright.config.ts, which
  # this change turns on. Playwright shards by group, and without it a
  # file+project is one indivisible group: the first attempt here split 50/50 by
  # test count and ran 1.5m against 4.0m, because `foundation.spec.ts` is 42% of
  # the suite's seconds and landed whole on one shard. That is measured CI, not
  # a projection — it made the job SLOWER than not sharding.
  #
  # Expect roughly a 4m job to become ~3.5m. The ceiling is `checks` at ~3.7m,
  # so this takes v2 off the critical path rather than shortening it much
  # further; more shards buy almost nothing against that floor.
  #
  # The REQUIRED context is the `v2-checks` aggregate below, not these shards, so
  # the shard count can change without touching branch protection.
  v2-suite:
    name: v2-suite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both shards always run: a red shard 1 must not hide a red shard 2.
      fail-fast: false
      matrix:
        # Duration-balanced, not Playwright's count-based `--shard` — see
        # playwright.config.ts for the measurement that forced this.
        shard: [heavy, rest]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            prototypes/v2/package-lock.json
            prototypes/v2-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install v2 dependencies
        run: npm ci --prefix prototypes/v2

      # The account specs run the real API behind the preview server (#1258); the suite's
      # global setup bundles it from these dependencies.
      - name: Install v2 API dependencies
        run: npm ci --prefix prototypes/v2-api

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV
        working-directory: prototypes/v2

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
        working-directory: prototypes/v2

      - name: Install Playwright system deps (browsers came from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
        working-directory: prototypes/v2

      # Typechecks public/ again, exports the app, then scripts/offline.mjs copies
      # the sound packs beside it and writes build.json (fingerprint + HEAD).
      - name: Build the v2 static export
        run: npm run build --prefix prototypes/v2

      - name: Run the v2 Playwright suite
        run: npm run test:e2e --prefix prototypes/v2
        env:
          V2_SHARD: ${{ matrix.shard }}

      # Every shard builds the export; exactly one uploads it, because two jobs
      # cannot publish the same artifact name. Nothing downloads it since the cutover
      # (#1357) retired the `/v2` publish — retained as this commit's beta-base evidence
      # until #1358 removes it.
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 'heavy'
        with:
          name: ensemble-v2-static-${{ github.sha }}
          path: prototypes/v2/out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: v2-playwright-failures-${{ matrix.shard }}
          path: prototypes/v2/test-results/
          retention-days: 7

  # The required status context. It exists so the shard count is an internal
  # detail: branch protection names `v2-checks` and never has to learn about the
  # matrix. `if: always()` is load-bearing — without it a failed shard would
  # SKIP this job, the required context would never report, and the PR would
  # block forever instead of going red.
  v2-checks:
    needs: v2-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every v2 shard to have passed
        # A matrix `needs` result is 'success' only when EVERY leg succeeded, so
        # this one comparison covers a failed, cancelled or skipped shard.
        run: |
          echo "v2-suite matrix result: ${{ needs.v2-suite.result }}"
          test "${{ needs.v2-suite.result }}" = success

  # Publish the v2 account API as an immutable image on every merge to main —
  # decision 1 of docs/design/ensemble-v2-rollout.md (#1216). The API suite itself
  # already runs inside `checks`, so this job only builds, pushes and smoke-tests
  # the image; nothing consumes it yet (that is #1219's release step). Fork PRs
  # never reach it: it runs on the main push only, and the package is public so
  # docker04 pulls without a credential.
  api-image:
    runs-on: ubuntu-latest
    needs: checks
    # `!inputs.hosting_probe` (#1357 patch P3-2): a read-only probe dispatched from `main`
    # must not build and PUSH `:sha-<commit>` and `:main` for a commit nobody asked to
    # release. `inputs` is null on a push, and a null property is falsy, so this changes
    # nothing for the merge path. `deploy` below accepts these jobs as skipped when, and
    # only when, the run is that probe.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !inputs.hosting_probe
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/brndnsh-labs/ensemble-api
    steps:
      - uses: actions/checkout@v7

      # The image copies a PREBUILT bundle (prototypes/v2-api/build.mjs, #1202): esbuild
      # inlines the shared songbook codecs from public/ via prototypes/v2/lib/sync, which
      # the Docker build context (prototypes/v2-api only) cannot see. Same bundle the
      # `checks` job already built and tested; rebuilt here because it is a 30-second
      # step and needs no artifact hand-off.
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: prototypes/v2-api/package-lock.json

      - name: Bundle the API
        run: |
          npm ci --prefix prototypes/v2-api
          npm run build --prefix prototypes/v2-api

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: prototypes/v2-api
          push: true
          provenance: false
          build-args: REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the pushed bytes boot: pull the sha tag back from the registry, start
      # it with a throwaway config and read /healthz. Fails the run (and so the
      # tag stays unreleased) if the container never becomes healthy or reports a
      # different revision than the commit that built it.
      - name: Smoke-test the pushed image
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE:sha-$GITHUB_SHA"
          cid=$(docker run --detach --rm --publish 127.0.0.1:8080:8080 \
            --env ENSEMBLE_RP_ID=localhost \
            --env ENSEMBLE_RP_NAME=Ensemble \
            --env ENSEMBLE_ORIGIN=http://localhost:8080 \
            --env ENSEMBLE_AUTH_IP_MODE=socket-only \
            --env "ENSEMBLE_AUTH_IP_SECRET=$(openssl rand -hex 32)" \
            "$IMAGE:sha-$GITHUB_SHA")
          trap 'docker logs "$cid" || true; docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if body=$(curl --silent --fail http://127.0.0.1:8080/healthz); then
              echo "$body"
              node --input-type=module --eval '
                const h = JSON.parse(process.argv[1]);
                if (h.status !== "ok") throw new Error(`status ${h.status}`);
                if (h.revision !== process.env.GITHUB_SHA) throw new Error(`revision ${h.revision}`);
              ' "$body"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API image never answered /healthz" >&2
          exit 1

  # Publish the v2 music stand as an immutable static image on every merge to main —
  # decision 1 of docs/design/ensemble-v2-rollout.md (#1356), the other half of the pair
  # `api-image` above already ships. Since the cutover (#1357) this image IS the site: the
  # `deploy` job below releases it to production, so it `needs:` this one and a red image
  # build stops the release outright. That inverts #1356's "must not hold up today's release"
  # — there is no other release any more.
  #
  # The required contexts (`checks`, `e2e-tests`, `v2-checks`) are still untouched: this runs on
  # the main push only, after the merge, and a merge is gated by what proves the code, not by
  # what publishes it.
  #
  # `needs: v2-checks` is the analogue of `api-image`'s `needs: checks`: the suite that
  # actually exercises this app has to be green before its bytes are published under a tag a
  # release command can name.
  #
  # `ensemble-web` is a public package, like `ensemble-api`: docker04 pulls anonymously.
  web-image:
    runs-on: ubuntu-latest
    needs: v2-checks
    # `!inputs.hosting_probe` (#1357 patch P3-2): a read-only probe dispatched from `main`
    # must not build and PUSH `:sha-<commit>` and `:main` for a commit nobody asked to
    # release. `inputs` is null on a push, and a null property is falsy, so this changes
    # nothing for the merge path. `deploy` below accepts these jobs as skipped when, and
    # only when, the run is that probe.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !inputs.hosting_probe
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/brndnsh-labs/ensemble-web
      # The cutover build: the stand at the site root, not at /v2. This is the ONE value that
      # changes what gets built (prototypes/v2/scripts/base-path.mjs, #1354).
      ENSEMBLE_V2_BASE: /
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            prototypes/v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install v2 dependencies
        run: npm ci --prefix prototypes/v2

      # Built here rather than downloaded: `v2-suite` uploads the `/v2` export, which is a
      # different artifact. The image COPYs this prebuilt output through a named build context,
      # so the Docker context stays hosting/web — same prebuilt-bundle shape as `api-image`.
      - name: Build the v2 static export at basePath /
        run: npm run build --prefix prototypes/v2

      - name: Assert the artifact is the root build
        run: |
          # `set -e` ignores a command inverted with `!`, so each negative is an explicit `if`.
          set -euo pipefail
          grep -q 'const SCOPE = "/";' prototypes/v2/out/sw.js
          # The cutover's own artifacts (#1355): the web manifest v1's installed PWA updates
          # into, and the tombstone that retires the beta's `/v2/` worker.
          test -f prototypes/v2/out/manifest.json
          test -f prototypes/v2/out/v2/sw.js
          if grep -q '/v2/_next/' prototypes/v2/out/index.html; then
            echo '::error::index.html still references /v2/_next'; exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `cache-from`/`cache-to`: this image is one COPY of a freshly built export over a
      # digest-pinned base, so there is no layer worth caching that pulling the base does not
      # already give — and the export's layer changes on every commit by construction.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: hosting/web
          build-contexts: site=prototypes/v2/out
          push: true
          provenance: false
          build-args: REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main

      # Prove the pushed bytes serve: pull the sha tag back from the registry and run the
      # container under the same flags the stack uses. Fails the run (so the tag stays
      # unreleased) on a redirected /v2/sw.js, an SPA fallback, an absolute redirect, a wrong
      # revision or any of the other contract lines in hosting/web/smoke.mjs.
      - name: Smoke-test the pushed image
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE:sha-$GITHUB_SHA"
          node hosting/web/smoke.mjs "$IMAGE:sha-$GITHUB_SHA" "$GITHUB_SHA"

  # Continuous deployment: main IS live. A push to main only happens via a green PR
  # merge, so reaching this job means the full gate already passed on this exact
  # commit — release it. `workflow_dispatch` on main is a manual break-glass re-release
  # (no new commit).
  #
  # Since the cutover (#1357) a release is a TAG, not a file transfer. The two rsync
  # publishes this job used to run — the v1 root app and the `/v2` export — are gone, with
  # the artifact downloads, the `static-artifact.mjs verify` step, the Node setup and the
  # `ensemble-deploy` SSH config that existed only to serve them. They had to go in the same
  # change that points production at the image: both scripts now REFUSE up front when their
  # origin serves a root `/build.json` (the "routed to the ensemble-web image" preflight in
  # `scripts/deploy.sh` and `prototypes/v2/scripts/deploy.mjs`), so leaving the steps here
  # would fail every merge. #1358 deletes the scripts themselves.
  #
  # `web-release` (#1356) is folded in here for the same reason. With the static publish gone
  # the two jobs were the same job — one tailnet join, one scoped key, one forced command —
  # and keeping them apart would have cost two tailnet joins and two key installs per merge,
  # plus the "deploy deliberately does not need web-image" caveat the cutover voids. One job
  # also means ONE serialization group covering both services, which is what the box's
  # per-stack lock wants anyway.
  #
  # RELEASE ORDER: prod first, then test — the API loop's existing order, now carrying the
  # web image too. Test-first is the tempting canary and it is the wrong trade here. The
  # canary already ran: `web-image` pulls the pushed tag back out of the registry and runs the
  # whole `hosting/web/smoke.mjs` contract against a container started under the stack's own
  # flags, before anything is released anywhere. What a test-host release would add over that
  # is "compose can bring this tag up", which is the same code path on both stacks and whose
  # failure modes are already non-destructive — an absent tag fails before the container is
  # touched, an unhealthy one is put back on the previous tag. Against that small gain,
  # test-first lets a staging host withhold the product's release, and hosting/README.md
  # explicitly allows an operator to point that host's Caddy elsewhere for a v1 audition.
  # Production does not queue behind staging.
  #
  # Within a stack: api, then web. Server before client, so the new stand never meets the
  # older API; it is one commit either way, and the two recreates are seconds apart.
  #
  # "Released" means the PUBLIC ORIGIN serves this commit (#1219's lesson: a release that
  # reports success while nothing changed), so each host's own `/build.json` is checked after
  # its release and a merge cannot report success without it.
  #
  # NETWORK: prod is a LAN backend with nothing exposed directly to the internet,
  # so a GitHub-hosted runner cannot reach it directly. It joins the tailnet as an
  # ephemeral, tag:ci node instead — see homelab-maintenance `tailscale/README.md`.
  # The tailnet policy grants tag:ci SSH to docker04's scoped accounts; CI never gets
  # Docker or sudo access. The old LXC hosts (115/116) were retired and deleted from
  # Proxmox 2026-09-13 — docker04 is the only production target.
  #
  # Fork PRs cannot reach any of this: secrets are withheld from fork-PR runs, and
  # this job doesn't run on `pull_request` at all. An explicitly dispatched probe
  # may run on a reviewed branch, but cannot execute the release step.
  deploy:
    runs-on: ubuntu-latest
    needs: [checks, e2e-tests, v2-checks, api-image, web-image]
    # A skipped `needs` would skip this job too, so each image job's acceptable results are
    # spelled out. `skipped` is acceptable IFF this run is the hosting probe — which since
    # patch P3-2 is the one case that skips them, on any ref, because a read-only probe must
    # not push image tags. The five reachable cases:
    #
    #   main push                    images run   -> success required, release runs
    #   main dispatch (no probe)     images run   -> success required, release runs
    #   main dispatch + probe        images skipped -> allowed, probe steps only
    #   non-main dispatch + probe    images skipped -> allowed, probe steps only
    #   pull_request                 images skipped -> last clause false, this job skips
    #
    # The old `github.ref != 'refs/heads/main'` allowance is gone: it could only ever be
    # reached together with `hosting_probe` (the last clause refuses a non-main dispatch
    # without it), and after P3-2 it would have been wrong anyway — a main-ref probe now
    # skips the image jobs too.
    if: >-
      !cancelled()
      && needs.checks.result == 'success'
      && needs.e2e-tests.result == 'success'
      && needs.v2-checks.result == 'success'
      && (needs.api-image.result == 'success' || (needs.api-image.result == 'skipped' && inputs.hosting_probe))
      && (needs.web-image.result == 'success' || (needs.web-image.result == 'skipped' && inputs.hosting_probe))
      && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && inputs.hosting_probe))
    # The honest worst case, added up rather than guessed: the box-side per-stack lock waits up
    # to 4 min, there are four healthcheck waits, and each of the two origin checks retries ten
    # times at up to 10s of curl plus a 6s sleep — ~2.7 min apiece. Tailscale and the key install
    # are another minute. 20 did not cover that.
    timeout-minutes: 30
    env:
      PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_DOCKER_HOST }}
    # Serialize releases across ALL runs, so they land in merge order. Without this, merge
    # B's job can overtake merge A's and leave the hosts on A — with both jobs green, since
    # each verifies only its own sha. Hosted runners really do run in parallel, so it has to
    # be stated. Never cancel-in-progress: an interrupted release is a stack half-way
    # between two tags.
    # GitHub keeps at most one PENDING run per group, so a third merge arriving while the
    # first is still releasing replaces the second in the queue — which is right, not a loss:
    # the newer commit contains the older one, so releasing it releases both.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # No checkout and no Node: every step below is ssh and curl. The release names a tag the
    # image jobs already published; nothing in this job reads the repository.
    steps:
      - name: Validate the release target
        run: |
          [[ "$PROD_DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] \
            || { echo '::error::Missing or invalid PROD_DEPLOY_DOCKER_HOST variable'; exit 1; }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: 'true'

      # Set explicitly rather than through the action's extra-args input, because
      # these two are load-bearing and worth being able to see:
      #   --accept-routes   Linux is the ONE platform where Tailscale does not accept
      #                     subnet routes by default. Without this the runner joins
      #                     the tailnet successfully and then cannot reach the LAN at
      #                     all — a confusing failure that looks like a firewall.
      #   --accept-dns=false  Keeps the runner on GitHub's resolver. Otherwise it
      #                     inherits pi-hole through the subnet router, which makes
      #                     npm installs depend on the LAN's DNS and makes the origin
      #                     checks below resolve ensemble.brndn.zip split-horizon
      #                     instead of over the public path a real visitor takes.
      - name: Accept subnet routes, keep GitHub's DNS
        run: sudo tailscale set --accept-routes --accept-dns=false

      # Fail here with a clear message rather than minutes later as an opaque ssh
      # timeout, if the tailnet path or the policy grant is wrong.
      - name: Verify the release target is reachable
        run: |
          tailscale status --peers=false
          timeout 20 bash -c "until </dev/tcp/$PROD_DEPLOY_HOST/22; do sleep 1; done" \
            || { echo "::error::Cannot reach $PROD_DEPLOY_HOST:22 over the tailnet — check the tag:ci grant in the tailnet policy."; exit 1; }

      # Every release goes through ONE scoped account (#1219): `ensemble-release`, whose key
      # is a forced command that accepts only `release <stack> <api|web> sha-<sha>` and sudoes
      # into one root-owned script on docker04 (homelab-maintenance docker/ensemble/release/).
      # CI holds no shell, no docker socket and no sudo of its own. Secrets go through env,
      # never interpolated into the command line.
      - name: Configure release SSH
        env:
          API_RELEASE_SSH_KEY: ${{ secrets.API_RELEASE_SSH_KEY }}
        run: |
          [[ -n "$API_RELEASE_SSH_KEY" ]] || { echo '::error::Missing API_RELEASE_SSH_KEY secret'; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$API_RELEASE_SSH_KEY" > ~/.ssh/ci_release_key
          chmod 600 ~/.ssh/ci_release_key
          {
            echo "Host ensemble-release"
            echo "  HostName $PROD_DEPLOY_HOST"
            echo "  User ensemble-release"
            echo "  IdentityFile ~/.ssh/ci_release_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config

      # A `workflow_dispatch` probe exercises the release account NEGATIVELY instead of
      # releasing: shell, foreign stack, floating tag, short tag and wrong service must all
      # be refused, and CI must not be able to reach a backend port directly.
      - name: Probe the release account without releasing
        if: inputs.hosting_probe
        run: |
          set -euo pipefail
          refused() { ! ssh -o BatchMode=yes ensemble-release "$@" >/dev/null 2>&1; }
          refused 'id'                                   # no shell
          refused 'release breakscope api sha-'"$GITHUB_SHA"   # foreign stack
          refused 'release ensemble api latest'          # floating tag
          refused 'release ensemble api sha-abc'         # short tag
          refused 'release ensemble static sha-'"$GITHUB_SHA"  # wrong service
          refused 'release ensembletest web latest'      # web is accepted (#1356), a floating tag is not
          echo 'ensemble-release refuses every malformed command'
          for port in 8090 8091 2375 2376; do
            if timeout 3 bash -c 'exec 3<>/dev/tcp/$1/$2' _ "$PROD_DEPLOY_HOST" "$port" 2>/dev/null; then
              echo "::error::CI unexpectedly reached backend port $port"; exit 1
            fi
          done

      # Roll the images this exact commit built (`api-image` and `web-image` above) into prod,
      # then test. The script on the box waits for each healthcheck and otherwise recreates the
      # service at the previous tag — on a first release, at the rendered default — so a red
      # step here means that host is still serving what it served before, including when the
      # tag does not exist at all, which fails before the container is touched.
      - name: Release this commit to prod, then test
        if: ${{ github.ref == 'refs/heads/main' && !inputs.hosting_probe }}
        run: |
          set -euo pipefail
          release() {
            ssh -o BatchMode=yes ensemble-release "release $1 $2 sha-$GITHUB_SHA"
          }
          # The image's /build.json names the commit it was built from; the ORIGIN must
          # answer with this one, through the public path a visitor takes.
          #
          # No `-f`: it makes curl exit non-zero AND discard the body, so a 502 from the edge
          # or a 404 from a mis-pointed Caddy handle used to report as an empty string — the
          # two failures this check is most likely to actually catch, and the two it said
          # least about. `-w` appends the status on its own line instead, and both halves are
          # printed. stderr is dropped rather than merged: an interleaved curl message would
          # land after the status line and take the status's place in the split below, and a
          # transport failure already reports itself as `000`.
          serving() {
            local origin="$1" reply='' status='' body=''
            for _ in $(seq 1 10); do
              reply=$(curl -sS --max-time 10 -H 'Cache-Control: no-cache' \
                -w $'\n%{http_code}' "$origin/build.json?release=$GITHUB_SHA" 2>/dev/null) \
                || reply=$'\n000'
              status=${reply##*$'\n'}
              body=${reply%$'\n'*}
              if [[ $status == 2* ]] \
                && grep -Eq "\"sourceRevision\":[[:space:]]*\"$GITHUB_SHA\"" <<<"$body"; then
                echo "$origin serves $GITHUB_SHA"
                return 0
              fi
              sleep 6
            done
            echo "::error::$origin/build.json did not name $GITHUB_SHA (last HTTP ${status:-none}): ${body:0:400}" >&2
            return 1
          }
          release ensemble api
          release ensemble web
          serving https://ensemble.brndn.zip
          release ensembletest api
          release ensembletest web
          serving https://ensembletest.brndn.zip
