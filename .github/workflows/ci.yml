# CI + continuous deployment. Moved here from `.forgejo/workflows/` at the
# 2026-08-04 GitHub flip.
#
# RUNNER: `ubuntu-latest`, NOT the org's self-hosted runner on ghrunner01. That is
# deliberate and not negotiable while this repo is public — the org runner group
# refuses public repos, and for good reason: a fork PR carries its own workflow YAML,
# so a self-hosted LAN box would execute an outside contributor's code. Being
# open-source means inviting exactly that traffic. Do not "fix" a queued job by
# switching to `[self-hosted, ensemble]`; it will queue forever.
#
# BRANCH PROTECTION: because this repo is public, a Free org CAN protect its branches
# server-side (it cannot for a private repo — that's why every other repo in this fleet
# relies on a client-side merge guard). `main` requires the `checks` and `e2e-tests`
# contexts, so the `needs:` edge below is a second belt, not the only one.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      hosting_probe:
        description: Read-only docker04 deployment-account probe (does not deploy)
        type: boolean
        default: false

# Supersede in-flight PR runs when a branch is pushed again. Runs on main are NOT
# grouped here (#1223): only publishing needs serializing and the `deploy` job carries
# its own group, so two merges' gates run side by side. A workflow-level group on main
# used to serialize every gate behind the previous merge's AND — GitHub keeps at most
# one pending run per group — cancelled a queued main run outright, losing that
# commit's receipt and api-image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The full non-browser gate. `npm run ci` is the single source of truth for
  # what "green" means — typecheck (public/ + tests/), depcheck, knip,
  # mutation/lint/docs checks, unit tests, production build, and bundle-size
  # budgets — so `npm run ci` locally predicts this job exactly. Keep this
  # job's checks == that script; don't add gate steps here that aren't in the
  # script (or vice versa).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            prototypes/v2-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the full gate (npm run ci)
        run: npm run ci

      # The gate already built the production bundle. Seal and retain those exact
      # bytes; the deploy job must never rebuild them (or use the E2E bridge build).
      - name: Seal production static artifact
        run: node scripts/static-artifact.mjs seal dist production

      - uses: actions/upload-artifact@v7
        with:
          name: ensemble-static-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The v2 account API (#1187) is a standalone sibling package under
      # prototypes/v2-api/ with its own package-lock.json — same --prefix
      # pattern v2-preview.yml uses for prototypes/v2. Kept HERE, not in
      # e2e-tests: this suite is node-environment-only (node:sqlite, no DOM),
      # so it doesn't need that job's browser install.
      - name: Install v2 account API dependencies
        run: npm ci --prefix prototypes/v2-api

      - name: Run v2 account API tests
        run: npm run test:api

  # No `needs: checks`: this is a required context in its own right, and the edge
  # only put it (and v2-checks) behind checks' ~3 minutes on the critical path (#1223).
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # `--with-deps` IS needed here, unlike on the old self-hosted runner where the
      # host libraries were installed once by hand. A GitHub-hosted runner is a fresh
      # VM every run, and the suite includes a Mobile Safari project — that's real
      # webkit, whose system libraries are NOT preinstalled on ubuntu-latest.
      # The browser binaries cache; the apt-installed libraries cannot, so a cache hit
      # still has to re-run `install-deps`.
      - name: Install Playwright browsers + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (browsers came from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      # The offline-audio guards (reverb tail decays, harmony click-free) run in
      # Vitest browser mode against the same Chromium installed above — they need
      # a real `OfflineAudioContext`, which the node-mode `npm test` (happy-dom)
      # can't provide. Kept here (not in the `checks` job / `npm run ci`) because
      # only this job installs a browser. Fast (~2s); runs before the e2e suite
      # so an audio-graph regression fails early.
      - name: Run browser-mode audio guards
        run: npm run test:browser

      - name: Verify account storage in Chromium and WebKit
        run: npm run test:sync

      # `npm run test:e2e` builds the production bundle (VITE_E2E_BRIDGE=1) and
      # serves it via `vite preview` (see playwright.config.ts webServer) — the
      # suite exercises the real shipped artifact, not the dev server.
      - name: Run Playwright tests
        run: npm run test:e2e

      # @v3 was a Forgejo-only pin (that build's artifact API rejected @v4+ with
      # GHESNotSupportedError). On github.com @v3 is dead — retired 2025-01 — so this
      # is @v7 now.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # The v2 music stand (prototypes/v2, Next static export) ships to production
  # at /v2 on the same merge as the root app, so it is gated the same way: build
  # + its own Playwright suite here, and the exact `out/` bytes are retained for
  # the deploy job (never rebuilt there). Runs on every PR, not only v2-touching
  # ones — the export compiles public/ through webpack, so any engine change can
  # break it. Starts alongside `checks`, not after it (#1223).
  #
  # SHARDED across two runners. The suite is wait-bound, not CPU-bound: measured
  # 2026-09-16 on a 4-core box, 100 tests take 245s on three workers and still
  # 185s on six, because the playback tests spend their time waiting on real
  # laps. Adding workers to one runner barely helps and is what starves the tab
  # enough to drop a chord from the chart (#1240).
  #
  # Sharding only pays off WITH `fullyParallel` in playwright.config.ts, which
  # this change turns on. Playwright shards by group, and without it a
  # file+project is one indivisible group: the first attempt here split 50/50 by
  # test count and ran 1.5m against 4.0m, because `foundation.spec.ts` is 42% of
  # the suite's seconds and landed whole on one shard. That is measured CI, not
  # a projection — it made the job SLOWER than not sharding.
  #
  # Expect roughly a 4m job to become ~3.5m. The ceiling is `checks` at ~3.7m,
  # so this takes v2 off the critical path rather than shortening it much
  # further; more shards buy almost nothing against that floor.
  #
  # The REQUIRED context is the `v2-checks` aggregate below, not these shards, so
  # the shard count can change without touching branch protection.
  v2-suite:
    name: v2-suite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both shards always run: a red shard 1 must not hide a red shard 2.
      fail-fast: false
      matrix:
        # Duration-balanced, not Playwright's count-based `--shard` — see
        # playwright.config.ts for the measurement that forced this.
        shard: [heavy, rest]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            prototypes/v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install v2 dependencies
        run: npm ci --prefix prototypes/v2

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV
        working-directory: prototypes/v2

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
        working-directory: prototypes/v2

      - name: Install Playwright system deps (browsers came from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
        working-directory: prototypes/v2

      # Typechecks public/ again, exports the app, then scripts/offline.mjs copies
      # the sound packs beside it and writes build.json (fingerprint + HEAD).
      - name: Build the v2 static export
        run: npm run build --prefix prototypes/v2

      - name: Run the v2 Playwright suite
        run: npm run test:e2e --prefix prototypes/v2
        env:
          V2_SHARD: ${{ matrix.shard }}

      # Every shard builds the export; exactly one uploads it, because two jobs
      # cannot publish the same artifact name. The deploy job downloads this
      # name, so it must keep matching `ensemble-v2-static-<sha>` exactly.
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 'heavy'
        with:
          name: ensemble-v2-static-${{ github.sha }}
          path: prototypes/v2/out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: v2-playwright-failures-${{ matrix.shard }}
          path: prototypes/v2/test-results/
          retention-days: 7

  # The required status context. It exists so the shard count is an internal
  # detail: branch protection names `v2-checks` and never has to learn about the
  # matrix. `if: always()` is load-bearing — without it a failed shard would
  # SKIP this job, the required context would never report, and the PR would
  # block forever instead of going red.
  v2-checks:
    needs: v2-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every v2 shard to have passed
        # A matrix `needs` result is 'success' only when EVERY leg succeeded, so
        # this one comparison covers a failed, cancelled or skipped shard.
        run: |
          echo "v2-suite matrix result: ${{ needs.v2-suite.result }}"
          test "${{ needs.v2-suite.result }}" = success

  # Publish the v2 account API as an immutable image on every merge to main —
  # decision 1 of docs/design/ensemble-v2-rollout.md (#1216). The API suite itself
  # already runs inside `checks`, so this job only builds, pushes and smoke-tests
  # the image; nothing consumes it yet (that is #1219's release step). Fork PRs
  # never reach it: it runs on the main push only, and the package is public so
  # docker04 pulls without a credential.
  api-image:
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/brndnsh-labs/ensemble-api
    steps:
      - uses: actions/checkout@v7

      # The image copies a PREBUILT bundle (prototypes/v2-api/build.mjs, #1202): esbuild
      # inlines the shared songbook codecs from public/ via prototypes/v2/lib/sync, which
      # the Docker build context (prototypes/v2-api only) cannot see. Same bundle the
      # `checks` job already built and tested; rebuilt here because it is a 30-second
      # step and needs no artifact hand-off.
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: prototypes/v2-api/package-lock.json

      - name: Bundle the API
        run: |
          npm ci --prefix prototypes/v2-api
          npm run build --prefix prototypes/v2-api

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: prototypes/v2-api
          push: true
          provenance: false
          build-args: REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the pushed bytes boot: pull the sha tag back from the registry, start
      # it with a throwaway config and read /healthz. Fails the run (and so the
      # tag stays unreleased) if the container never becomes healthy or reports a
      # different revision than the commit that built it.
      - name: Smoke-test the pushed image
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE:sha-$GITHUB_SHA"
          cid=$(docker run --detach --rm --publish 127.0.0.1:8080:8080 \
            --env ENSEMBLE_RP_ID=localhost \
            --env ENSEMBLE_RP_NAME=Ensemble \
            --env ENSEMBLE_ORIGIN=http://localhost:8080 \
            --env ENSEMBLE_AUTH_IP_MODE=socket-only \
            --env "ENSEMBLE_AUTH_IP_SECRET=$(openssl rand -hex 32)" \
            "$IMAGE:sha-$GITHUB_SHA")
          trap 'docker logs "$cid" || true; docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if body=$(curl --silent --fail http://127.0.0.1:8080/healthz); then
              echo "$body"
              node --input-type=module --eval '
                const h = JSON.parse(process.argv[1]);
                if (h.status !== "ok") throw new Error(`status ${h.status}`);
                if (h.revision !== process.env.GITHUB_SHA) throw new Error(`revision ${h.revision}`);
              ' "$body"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API image never answered /healthz" >&2
          exit 1

  # Continuous deployment: main IS live. A push to main only happens via a green PR
  # merge, so reaching this job means the full gate already passed on this exact
  # commit — deploy it. `workflow_dispatch` on main is a manual break-glass redeploy
  # (no new commit).
  #
  # NETWORK: prod is a LAN backend with nothing exposed directly to the internet,
  # so a GitHub-hosted runner cannot reach it directly. It joins the tailnet as an
  # ephemeral, tag:ci node instead — see homelab-maintenance `tailscale/README.md`.
  # The tailnet policy grants tag:ci SSH to docker04's scoped static-file account;
  # CI never gets Docker or sudo access. The old LXC hosts (115/116) were retired
  # and deleted from Proxmox 2026-09-13 — docker04 is the only production target.
  #
  # Fork PRs cannot reach any of this: secrets are withheld from fork-PR runs, and
  # this job doesn't run on `pull_request` at all. An explicitly dispatched probe
  # may run on a reviewed branch, but cannot execute the deployment step.
  deploy:
    runs-on: ubuntu-latest
    needs: [checks, e2e-tests, v2-checks, api-image]
    # `api-image` is skipped on a non-main hosting probe, and a skipped `needs`
    # would skip this job too; spell out that the three gates must have passed
    # and the image job must have passed or been skipped for that reason only.
    if: >-
      !cancelled()
      && needs.checks.result == 'success'
      && needs.e2e-tests.result == 'success'
      && needs.v2-checks.result == 'success'
      && (needs.api-image.result == 'success' || (needs.api-image.result == 'skipped' && github.ref != 'refs/heads/main'))
      && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && inputs.hosting_probe))
    timeout-minutes: 10
    env:
      PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_DOCKER_HOST }}
      DEPLOY_SSH_USER: ensemble-deploy
    # Serialize deploys across ALL runs. On the old self-hosted setup this came free
    # from having exactly one runner; hosted runners really do run in parallel, so it
    # has to be stated. Never cancel-in-progress — an interrupted rsync is a
    # half-deployed site.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download the gated production artifact
        uses: actions/download-artifact@v8
        with:
          name: ensemble-static-${{ github.sha }}
          path: dist/

      - name: Verify artifact bytes and checkout provenance
        run: node scripts/static-artifact.mjs verify dist prod

      - name: Validate the deploy target
        run: |
          [[ "$PROD_DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] \
            || { echo '::error::Missing or invalid PROD_DEPLOY_DOCKER_HOST variable'; exit 1; }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: 'true'

      # Set explicitly rather than through the action's extra-args input, because
      # these two are load-bearing and worth being able to see:
      #   --accept-routes   Linux is the ONE platform where Tailscale does not accept
      #                     subnet routes by default. Without this the runner joins
      #                     the tailnet successfully and then cannot reach the LAN at
      #                     all — a confusing failure that looks like a firewall.
      #   --accept-dns=false  Keeps the runner on GitHub's resolver. Otherwise it
      #                     inherits pi-hole through the subnet router, which makes
      #                     npm installs depend on the LAN's DNS and makes deploy.sh's
      #                     post-deploy check resolve ensemble.brndn.zip split-horizon
      #                     instead of over the public path a real visitor takes.
      - name: Accept subnet routes, keep GitHub's DNS
        run: sudo tailscale set --accept-routes --accept-dns=false

      # Fail here with a clear message rather than 10 minutes later as an opaque
      # rsync timeout, if the tailnet path or the policy grant is wrong.
      - name: Verify the deploy target is reachable
        run: |
          tailscale status --peers=false
          timeout 20 bash -c "until </dev/tcp/$PROD_DEPLOY_HOST/22; do sleep 1; done" \
            || { echo "::error::Cannot reach $PROD_DEPLOY_HOST:22 over the tailnet — check the tag:ci grant in the tailnet policy."; exit 1; }

      # Materialize the `ensemble-admin` ssh alias that deploy.sh targets, from
      # the dedicated CI deploy key (a scoped keypair — not the laptop's key).
      # Secrets go through env, never interpolated into the command line.
      - name: Configure deploy SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          {
            echo "Host ensemble-admin"
            echo "  HostName $PROD_DEPLOY_HOST"
            echo "  User $DEPLOY_SSH_USER"
            echo "  IdentityFile ~/.ssh/ci_deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config

      # The API release goes through a SECOND, separately scoped account (#1219):
      # `ensemble-release`, whose key is a forced command that accepts only
      # `release <stack> api sha-<sha>` and sudoes into one root-owned script on
      # docker04 (homelab-maintenance docker/ensemble/release/). CI still holds
      # no shell, no docker socket and no sudo of its own.
      - name: Configure API release SSH
        env:
          API_RELEASE_SSH_KEY: ${{ secrets.API_RELEASE_SSH_KEY }}
        run: |
          [[ -n "$API_RELEASE_SSH_KEY" ]] || { echo '::error::Missing API_RELEASE_SSH_KEY secret'; exit 1; }
          printf '%s\n' "$API_RELEASE_SSH_KEY" > ~/.ssh/ci_release_key
          chmod 600 ~/.ssh/ci_release_key
          {
            echo "Host ensemble-release"
            echo "  HostName $PROD_DEPLOY_HOST"
            echo "  User ensemble-release"
            echo "  IdentityFile ~/.ssh/ci_release_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config

      - name: Probe docker04 without deploying
        if: inputs.hosting_probe
        run: |
          ssh ensemble-admin 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ $(id -un) = ensemble-deploy && $(id -Gn) = ensemble-deploy ]]
          [[ $(cat /srv/ensemble-prod/www/.ensemble-static-root) = ensemble-static-v1 ]]
          test -w /srv/ensemble-prod/www
          test ! -w /srv/ensemble-test/www
          test ! -w /srv/ensemble-prod/nginx.conf
          test ! -w /var/run/docker.sock
          cd /srv/ensemble-prod/www/current
          sha256sum --check --strict --quiet .ensemble-checksums
          REMOTE

      - name: Probe the API release account without releasing
        if: inputs.hosting_probe
        run: |
          set -euo pipefail
          refused() { ! ssh -o BatchMode=yes ensemble-release "$@" >/dev/null 2>&1; }
          refused 'id'                                   # no shell
          refused 'release breakscope api sha-'"$GITHUB_SHA"   # foreign stack
          refused 'release ensemble api latest'          # floating tag
          refused 'release ensemble api sha-abc'         # short tag
          refused 'release ensemble static sha-'"$GITHUB_SHA"  # wrong service
          echo 'ensemble-release refuses every malformed command'
          for port in 8090 8091 2375 2376; do
            if timeout 3 bash -c 'exec 3<>/dev/tcp/$1/$2' _ "$PROD_DEPLOY_HOST" "$port" 2>/dev/null; then
              echo "::error::CI unexpectedly reached backend port $port"; exit 1
            fi
          done

      - name: Deploy to prod
        if: ${{ github.ref == 'refs/heads/main' && !inputs.hosting_probe }}
        run: ./scripts/deploy.sh prod --artifact dist

      # Second release on the same merge: the v2 music stand at /v2. Same scoped
      # account and key; its own immutable release dir + symlink swap under the
      # prod static root, verified over the public origin. The root app was
      # already activated above and must be byte-identical afterwards.
      - name: Download the gated v2 artifact
        if: ${{ github.ref == 'refs/heads/main' && !inputs.hosting_probe }}
        uses: actions/download-artifact@v8
        with:
          name: ensemble-v2-static-${{ github.sha }}
          path: prototypes/v2/out/

      - name: Deploy the v2 music stand to prod
        if: ${{ github.ref == 'refs/heads/main' && !inputs.hosting_probe }}
        run: node scripts/deploy.mjs prod
        working-directory: prototypes/v2

      # Roll the image this exact commit built (api-image above) into prod, then
      # test (test follows main until a branch-audition need appears). The script
      # on the box waits for the healthcheck and rolls back on failure, so a red
      # step here means the API is still serving the previous tag.
      - name: Release the account API
        if: ${{ github.ref == 'refs/heads/main' && !inputs.hosting_probe }}
        run: |
          set -euo pipefail
          for stack in ensemble ensembletest; do
            ssh -o BatchMode=yes ensemble-release "release $stack api sha-$GITHUB_SHA"
          done
