# Every pull request is checked and built (the `build` job, which `main` requires
# before a merge). Every push to main, which is what a merge is, is checked, built
# into an image, and released: to the test site, https://ensembletest.brndn.zip,
# then, once the smoke journeys have passed against that site, to production,
# https://ensemble.brndn.zip. A job that fails stops the run there, red, and
# production keeps what it had. Nothing is pushed or released for a pull request.
# The release is release.yml; this file says when it runs.
#
# Run by hand from the Actions tab (or `gh workflow run ci -f commit=<sha>`), it
# builds nothing: it puts production on a commit of main whose image is already
# in the registry, the tip of main unless another is named. That is how
# production is put back. The next merge moves it forward again.
#
# The release is the one the homelab already offers (homelab-maintenance,
# docker/ensemble/release/): the runner joins the tailnet as a tag:ci node and
# speaks to one scoped account on the Docker host, whose key can run exactly
# `release <stack> <service> sha-<commit>`. The box pulls that tag, waits for
# the container to be healthy, and puts the previous one back if it is not.
# CI holds no shell there.
#
# Needs, in the repository's settings: the secrets TS_OAUTH_CLIENT_ID,
# TS_OAUTH_SECRET and API_RELEASE_SSH_KEY, and the variable
# PROD_DEPLOY_DOCKER_HOST.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Put production on this commit of main (all 40 characters; empty for the tip of main). Its image must be in the registry.
        type: string
        default: ""
      test:
        description: Put the test site on that commit as well
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/brndnsh-labs/ensemble-web

jobs:
  build:
    # A run by hand releases an image that is already there, and builds nothing.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # The time budgets are kept on the machine the work is done on; here they are reported.
      ENSEMBLE_BUDGET: report
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, the engine suite
        run: pnpm check

      # Reports movement, and fails only on a drop past a metric's tolerance.
      - name: The scorecards
        run: pnpm score

      # Every ear case names a file and a heading that are there. Only the check: the rest
      # of `ears` reads the scorecards' history, and this checkout is one commit deep.
      - name: The ear cases' sources
        run: pnpm ears --check

      # Builds the app itself and runs the journeys in the runner's own Chrome.
      - name: The browser smoke journeys
        run: pnpm smoke

      # `pnpm image` builds the site again from this commit and the image around it, and
      # refuses a tree with changes, so the image is the commit it is named for.
      - name: Build the image
        run: pnpm image

      - name: Log in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image under this commit
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag ensemble-app:latest "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"

  # The release itself is release.yml. One at a time, each whole (test site, journeys,
  # production) before the next begins, none cut short and none dropped while it waits:
  # an interrupted release is a stack half-way between two images.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/release.yml
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      API_RELEASE_SSH_KEY: ${{ secrets.API_RELEASE_SSH_KEY }}

  # By hand, and only from main: production on a named commit. It waits on no build.
  restore:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/release.yml
    with:
      by_hand: true
      commit: ${{ inputs.commit }}
      test: ${{ inputs.test }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      API_RELEASE_SSH_KEY: ${{ secrets.API_RELEASE_SSH_KEY }}
