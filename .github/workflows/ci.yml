# Every pull request is checked and built (the `build` job, which `main` requires
# before a merge). Every push to main, which is what a merge is, is checked, built
# into an image, and released to the test site, https://ensembletest.brndn.zip.
# Production, https://ensemble.brndn.zip, is released by hand: run this workflow
# from the Actions tab with "production" ticked, and the commit at the tip of main
# goes there too. Nothing is pushed or released for a pull request.
#
# The release is the one the homelab already offers (homelab-maintenance,
# docker/ensemble/release/): the runner joins the tailnet as a tag:ci node and
# speaks to one scoped account on the Docker host, whose key can run exactly
# `release <stack> <service> sha-<commit>`. The box pulls that tag, waits for
# the container to be healthy, and puts the previous one back if it is not.
# CI holds no shell there.
#
# Needs, in the repository's settings: the secrets TS_OAUTH_CLIENT_ID,
# TS_OAUTH_SECRET and API_RELEASE_SSH_KEY, and the variable
# PROD_DEPLOY_DOCKER_HOST.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: Release this commit to production (ensemble.brndn.zip) as well as the test site
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/brndnsh-labs/ensemble-web

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # The time budgets are kept on the machine the work is done on; here they are reported.
      ENSEMBLE_BUDGET: report
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, the engine suite
        run: pnpm check

      # Reports movement, and fails only on a drop past a metric's tolerance.
      - name: The scorecards
        run: pnpm score

      # Builds the app itself and runs the journeys in the runner's own Chrome.
      - name: The browser smoke journeys
        run: pnpm smoke

      # `pnpm image` builds the site again from this commit and the image around it, and
      # refuses a tree with changes, so the image is the commit it is named for.
      - name: Build the image
        run: pnpm image

      - name: Log in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image under this commit
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag ensemble-app:latest "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One release at a time, in the order the commits arrived, and never cut short:
    # an interrupted release is a stack half-way between two images.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.PROD_DEPLOY_DOCKER_HOST }}
    steps:
      - name: Check the release target is named
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] \
            || { echo '::error::Missing or invalid PROD_DEPLOY_DOCKER_HOST variable'; exit 1; }

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: "true"

      # Linux does not accept subnet routes unless told to, and without them the runner
      # cannot reach the LAN. DNS stays GitHub's, so the checks below reach the sites by
      # the public path a visitor takes.
      - name: Accept subnet routes, keep GitHub's DNS
        run: sudo tailscale set --accept-routes --accept-dns=false

      - name: Check the release target is reachable
        run: |
          timeout 20 bash -c "until </dev/tcp/$DEPLOY_HOST/22; do sleep 1; done" \
            || { echo "::error::Cannot reach $DEPLOY_HOST:22 over the tailnet."; exit 1; }

      - name: Install the release key
        env:
          RELEASE_KEY: ${{ secrets.API_RELEASE_SSH_KEY }}
        run: |
          [[ -n "$RELEASE_KEY" ]] || { echo '::error::Missing API_RELEASE_SSH_KEY secret'; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RELEASE_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          {
            echo "Host ensemble-release"
            echo "  HostName $DEPLOY_HOST"
            echo "  User ensemble-release"
            echo "  IdentityFile ~/.ssh/release_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config

      # "Released" means the public site says it is serving this commit (`build.json`, written
      # into the image by `pnpm image`), not that a command returned.
      - name: Release
        env:
          PRODUCTION: ${{ inputs.production }}
        run: |
          set -euo pipefail
          release() {
            ssh -o BatchMode=yes ensemble-release "release $1 web sha-$GITHUB_SHA"
          }
          serving() {
            local origin="$1" body=''
            for _ in $(seq 1 10); do
              body=$(curl -sS --max-time 10 -H 'Cache-Control: no-cache' \
                "$origin/build.json?release=$GITHUB_SHA" 2>/dev/null || true)
              if grep -q "$GITHUB_SHA" <<<"$body"; then
                echo "$origin serves $GITHUB_SHA"
                return 0
              fi
              sleep 6
            done
            echo "::error::$origin/build.json did not name $GITHUB_SHA: ${body:0:300}" >&2
            return 1
          }
          release ensembletest
          serving https://ensembletest.brndn.zip
          if [[ "$PRODUCTION" == "true" ]]; then
            release ensemble
            serving https://ensemble.brndn.zip
          fi
