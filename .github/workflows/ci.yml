# Dormant until the repo has a GitHub remote. The same checks and budgets run
# locally with `pnpm check`; see docs/TESTING.md for what the budgets are for.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Corpus, properties, goldens: 10 seconds, enforced by scripts/budget.ts.
      - run: pnpm test
      # The scorecard job (2 minutes, report only except for tolerance failures) joins at stage 2.
      # Browser smoke journeys (60 seconds, on merge to main only) join at stage 6.
