name: Update E2E Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install E2E Fonts (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright Dependencies (Ubuntu)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Update Snapshots
        run: npm run test:e2e:update

      - name: Create Pull Request for Snapshots
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update e2e snapshots from CI"
          branch: ci/update-snapshots
          delete-branch: true
          title: "🤖 Automated E2E Snapshot Update"
          body: |
            This PR updates the E2E visual snapshots using the Ubuntu CI environment.
            
            **Why?**
            Rendering differences between local OS and CI (fonts, anti-aliasing) often cause visual regression failures. By generating snapshots in CI, we ensure 100% parity with the verification environment.
            
            **How to use:**
            1. Review the changes in this PR.
            2. Merge this PR into `main`.
            3. Future CI runs on `main` will now pass.
          add-paths: |
            tests/e2e/**-snapshots/*.png
