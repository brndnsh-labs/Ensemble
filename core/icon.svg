<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ensemble">
  <!-- Ensemble icon — an organic waveform of the five instrument hues (chords blue, bass green, soloist magenta, harmony violet, drums taupe) under the After-Hours lamp glow on warm ink. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1610"/>
      <stop offset="1" stop-color="#120f0a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.08" r="0.78">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0.20"/>
      <stop offset="0.62" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="99" y1="0" x2="414" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ab33a"/>
      <stop offset="0.27" stop-color="#8b86d6"/>
      <stop offset="0.5" stop-color="#4a9fd4"/>
      <stop offset="0.73" stop-color="#e0568f"/>
      <stop offset="1" stop-color="#b8a98a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#ink)"/>
  <rect width="512" height="512" rx="116" fill="url(#lamp)"/>
  <!-- waveform: 13 gradient lines, organic envelope, centered on the mid-axis -->
  <rect x="98.5" y="216" width="15" height="80" rx="7.5" fill="url(#wave)"/>
  <rect x="123.5" y="194" width="15" height="124" rx="7.5" fill="url(#wave)"/>
  <rect x="148.5" y="144" width="15" height="224" rx="7.5" fill="url(#wave)"/>
  <rect x="173.5" y="164" width="15" height="184" rx="7.5" fill="url(#wave)"/>
  <rect x="198.5" y="118" width="15" height="276" rx="7.5" fill="url(#wave)"/>
  <rect x="223.5" y="136" width="15" height="240" rx="7.5" fill="url(#wave)"/>
  <rect x="248.5" y="106" width="15" height="300" rx="7.5" fill="url(#wave)"/>
  <rect x="273.5" y="136" width="15" height="240" rx="7.5" fill="url(#wave)"/>
  <rect x="298.5" y="118" width="15" height="276" rx="7.5" fill="url(#wave)"/>
  <rect x="323.5" y="164" width="15" height="184" rx="7.5" fill="url(#wave)"/>
  <rect x="348.5" y="144" width="15" height="224" rx="7.5" fill="url(#wave)"/>
  <rect x="373.5" y="194" width="15" height="124" rx="7.5" fill="url(#wave)"/>
  <rect x="398.5" y="216" width="15" height="80" rx="7.5" fill="url(#wave)"/>
</svg>
